<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>คลังรวมและเผยแพร่โครงงานวิจัยบัณฑิตศึกษาและโปรเจกต์จบ | มหาวิทยาลัยราชภัฏสุรินทร์ (SRRU)</title>
    <meta name="description" content="ระบบสืบค้นและคลังโครงงานวิจัยบัณฑิตศึกษาและโปรเจกต์จบ มหาวิทยาลัยราชภัฏสุรินทร์ พร้อมระบบแนะนำงานวิจัยอัจฉริยะด้วย AI & Thai NLP" />
    <!-- Google Fonts: IBM Plex Sans Thai, Noto Sans Thai, Sarabun, Inter (Clean Academic & Highly Legible Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Instant Theme Bootstrap -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('srru_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#faf8fd] dark:bg-[#0b0713] text-slate-800 dark:text-slate-100 antialiased selection:bg-purple-600 selection:text-white min-h-screen transition-colors duration-300">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
